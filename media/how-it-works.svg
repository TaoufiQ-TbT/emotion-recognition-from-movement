  <path d="M467.0 212.0 L467.0 247.33333333333331" fill="none" stroke="#8b949e" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#head)"/>
  <rect x="396" y="249.33333333333331" width="142" height="76" rx="9" fill="#222a35" stroke="#3a4453"/>
  <text x="467.0" y="284.3333333333333" font-size="15" font-weight="600" fill="#f0f6fc" text-anchor="middle" textLength="118.1" lengthAdjust="spacingAndGlyphs">Joint speed limit</text>
  <text x="467.0" y="302.3333333333333" font-size="12.5" font-weight="400" fill="#a3adb8" text-anchor="middle" textLength="109.1" lengthAdjust="spacingAndGlyphs">0.38 m per sample</text>
  <path d="M467.0 325.3333333333333 L467.0 360.66666666666663" fill="none" stroke="#8b949e" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#head)"/>
