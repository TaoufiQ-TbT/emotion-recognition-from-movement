  <text x="219.0" y="503.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" textLength="60.0" lengthAdjust="spacingAndGlyphs">3D pose</text>
  <text x="219.0" y="520.0" font-size="12.5" font-weight="500" fill="#ffffff" text-anchor="middle" textLength="81.4" lengthAdjust="spacingAndGlyphs">33 landmarks</text>
  <path d="M219.0 448 L219.0 474" fill="none" stroke="#8b949e" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#head)"/>
  <rect x="382" y="44" width="170" height="506" rx="14" fill="#161b22" stroke="#30363d"/>
  <text x="398" y="72" font-size="12.5" font-weight="700" fill="#a5a4ff" text-anchor="start" letter-spacing="1.4" textLength="62.6" lengthAdjust="spacingAndGlyphs">STAGE 2</text>
  <text x="398" y="97" font-size="17" font-weight="700" fill="#f0f6fc" text-anchor="start" textLength="122.6" lengthAdjust="spacingAndGlyphs">Quality Control</text>
  <text x="398" y="119" font-size="17" font-weight="700" fill="#f0f6fc" text-anchor="start" textLength="97.5" lengthAdjust="spacingAndGlyphs">&amp; Denoising</text>
  <rect x="396" y="136.0" width="142" height="76" rx="9" fill="#222a35" stroke="#3a4453"/>
