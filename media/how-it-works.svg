  <text x="219.0" y="438.0" font-size="12.5" font-weight="400" fill="#a3adb8" text-anchor="middle" textLength="101.5" lengthAdjust="spacingAndGlyphs">best version wins</text>
  <path d="M219.0 380 L219.0 396" fill="none" stroke="#8b949e" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#head)"/>
