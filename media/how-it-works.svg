  <text x="624" y="97" font-size="17" font-weight="700" fill="#f0f6fc" text-anchor="start" textLength="150.0" lengthAdjust="spacingAndGlyphs">Feature Extraction</text>
  <text x="624" y="119" font-size="17" font-weight="700" fill="#f0f6fc" text-anchor="start" textLength="50.4" lengthAdjust="spacingAndGlyphs">(LMA)</text>
