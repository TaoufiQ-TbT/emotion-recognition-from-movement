<svg xmlns="http://www.w3.org/2000/svg" width="1116" height="566" viewBox="0 0 1116 566" role="img" aria-label="The four stages of the system, from video to emotion probabilities">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5553dd"/><stop offset="1" stop-color="#1467d6"/></linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker>
  </defs>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <rect x="0.5" y="0.5" width="1115" height="565" rx="16" fill="#0d1117" stroke="#30363d"/>
  <rect x="112" y="44" width="214" height="506" rx="14" fill="#161b22" stroke="#30363d"/>
  <text x="128" y="72" font-size="12.5" font-weight="700" fill="#a5a4ff" text-anchor="start" letter-spacing="1.4" textLength="61.0" lengthAdjust="spacingAndGlyphs">STAGE 1</text>
  <text x="128" y="97" font-size="17" font-weight="700" fill="#f0f6fc" text-anchor="start" textLength="67.0" lengthAdjust="spacingAndGlyphs">3D Pose</text>
  <text x="128" y="119" font-size="17" font-weight="700" fill="#f0f6fc" text-anchor="start" textLength="86.7" lengthAdjust="spacingAndGlyphs">Estimation</text>
  <rect x="20" y="133" width="62" height="52" rx="9" fill="#222a35" stroke="#3a4453"/>
  <text x="51.0" y="155.5" font-size="14" font-weight="600" fill="#f0f6fc" text-anchor="middle" textLength="38.7" lengthAdjust="spacingAndGlyphs">Video</text>
  <text x="51.0" y="172.5" font-size="14" font-weight="600" fill="#f0f6fc" text-anchor="middle" textLength="36.5" lengthAdjust="spacingAndGlyphs">asset</text>
  <rect x="126" y="136" width="186" height="46" rx="9" fill="#222a35" stroke="#3a4453"/>
  <text x="219.0" y="164.0" font-size="15" font-weight="600" fill="#f0f6fc" text-anchor="middle" textLength="114.0" lengthAdjust="spacingAndGlyphs">Frame sampling</text>
  <path d="M82 159 L124 159" fill="none" stroke="#8b949e" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#head)"/>
  <rect x="122" y="202" width="194" height="110" rx="9" fill="none" stroke="#4a5566" stroke-dasharray="4 4"/>
  <rect x="126.0" y="208" width="89.0" height="46" rx="9" fill="#222a35" stroke="#3a4453"/>
  <text x="170.5" y="236.0" font-size="13.5" font-weight="600" fill="#f0f6fc" text-anchor="middle" textLength="27.5" lengthAdjust="spacingAndGlyphs">Raw</text>
  <rect x="223.0" y="208" width="89.0" height="46" rx="9" fill="#222a35" stroke="#3a4453"/>
  <text x="267.5" y="236.0" font-size="13.5" font-weight="600" fill="#f0f6fc" text-anchor="middle" textLength="78.6" lengthAdjust="spacingAndGlyphs">Person crop</text>
  <rect x="126.0" y="260" width="89.0" height="46" rx="9" fill="#222a35" stroke="#3a4453"/>
  <text x="170.5" y="279.5" font-size="13.5" font-weight="400" fill="#f0f6fc" text-anchor="middle" textLength="62.8" lengthAdjust="spacingAndGlyphs">Denoise +</text>
  <text x="170.5" y="296.5" font-size="13.5" font-weight="400" fill="#f0f6fc" text-anchor="middle" textLength="50.8" lengthAdjust="spacingAndGlyphs">sharpen</text>
  <rect x="223.0" y="260" width="89.0" height="46" rx="9" fill="#222a35" stroke="#3a4453"/>
  <text x="267.5" y="279.5" font-size="13.5" font-weight="400" fill="#f0f6fc" text-anchor="middle" textLength="50.6" lengthAdjust="spacingAndGlyphs">Lighting</text>
  <text x="267.5" y="296.5" font-size="13.5" font-weight="400" fill="#f0f6fc" text-anchor="middle" textLength="64.1" lengthAdjust="spacingAndGlyphs">correction</text>
  <path d="M219.0 182 L219.0 200" fill="none" stroke="#8b949e" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#head)"/>
  <rect x="126" y="330" width="186" height="50" rx="9" fill="#222a35" stroke="#3a4453"/>
  <text x="219.0" y="352.0" font-size="15" font-weight="600" fill="#f0f6fc" text-anchor="middle" textLength="113.8" lengthAdjust="spacingAndGlyphs">MediaPipe Pose</text>
