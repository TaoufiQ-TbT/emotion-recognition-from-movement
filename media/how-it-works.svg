  <text x="974.0" y="429.0" font-size="12.5" font-weight="400" fill="#a3adb8" text-anchor="middle" textLength="159.6" lengthAdjust="spacingAndGlyphs">averaged over the windows</text>
  <path d="M974.0 366 L974.0 384" fill="none" stroke="#8b949e" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#head)"/>
  <rect x="870" y="476" width="208" height="58" rx="10" fill="url(#accent)" stroke="none"/>
  <text x="974.0" y="503.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" textLength="73.5" lengthAdjust="spacingAndGlyphs">6 emotion</text>
  <text x="974.0" y="520.0" font-size="12.5" font-weight="500" fill="#ffffff" text-anchor="middle" textLength="74.2" lengthAdjust="spacingAndGlyphs">probabilities</text>
  <path d="M974.0 442 L974.0 474" fill="none" stroke="#8b949e" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#head)"/>
  <path d="M312 505.0 L354.0 505.0 L354.0 174 L394 174" fill="none" stroke="#8b949e" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#head)"/>
  <path d="M538 505.0 L580.0 505.0 L580.0 291.0 L616 291.0" fill="none" stroke="#8b949e" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#head)"/>
  <path d="M778 505.0 L812.0 505.0 L812.0 241 L874 241" fill="none" stroke="#8b949e" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#head)"/>
  <path d="M580.0 291.0 L580.0 26 L836.0 26 L836.0 171 L874 171" fill="none" stroke="#8b949e" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#head)"/>
  <circle cx="580.0" cy="291.0" r="3.5" fill="#8b949e"/>
  <text x="708.0" y="18" font-size="12.5" font-weight="400" fill="#a3adb8" text-anchor="middle" textLength="285.5" lengthAdjust="spacingAndGlyphs">clean 3D pose goes straight to the pose encoder</text>
  </g>
