  <rect x="622" y="401" width="156" height="45" rx="9" fill="#222a35" stroke="#3a4453"/>
  <text x="700.0" y="428.5" font-size="14" font-weight="600" fill="#f0f6fc" text-anchor="middle" textLength="110.9" lengthAdjust="spacingAndGlyphs">Torso inclination</text>
  <path d="M700.0 450 L700.0 474" fill="none" stroke="#8b949e" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#head)"/>
  <rect x="622" y="476" width="156" height="58" rx="10" fill="url(#accent)" stroke="none"/>
  <text x="700.0" y="503.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" textLength="75.0" lengthAdjust="spacingAndGlyphs">6 features</text>
  <text x="700.0" y="520.0" font-size="12.5" font-weight="500" fill="#ffffff" text-anchor="middle" textLength="58.2" lengthAdjust="spacingAndGlyphs">per frame</text>
  <rect x="856" y="44" width="236" height="506" rx="14" fill="#161b22" stroke="#30363d"/>
  <text x="872" y="72" font-size="12.5" font-weight="700" fill="#a5a4ff" text-anchor="start" letter-spacing="1.4" textLength="63.1" lengthAdjust="spacingAndGlyphs">STAGE 4</text>
