  <text x="467.0" y="397.66666666666663" font-size="15" font-weight="600" fill="#f0f6fc" text-anchor="middle" textLength="91.8" lengthAdjust="spacingAndGlyphs">Frame check</text>
  <text x="467.0" y="415.66666666666663" font-size="12.5" font-weight="400" fill="#a3adb8" text-anchor="middle" textLength="115.6" lengthAdjust="spacingAndGlyphs">at least 60% usable</text>
  <path d="M467.0 438.66666666666663 L467.0 473.99999999999994" fill="none" stroke="#8b949e" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#head)"/>
  <rect x="396" y="476" width="142" height="58" rx="10" fill="url(#accent)" stroke="none"/>
  <text x="467.0" y="510.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" textLength="105.3" lengthAdjust="spacingAndGlyphs">Clean 3D pose</text>
