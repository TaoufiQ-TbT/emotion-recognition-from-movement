  <path d="M219.0 312 L219.0 328" fill="none" stroke="#8b949e" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#head)"/>
  <rect x="126" y="398" width="186" height="50" rx="9" fill="#222a35" stroke="#3a4453"/>
